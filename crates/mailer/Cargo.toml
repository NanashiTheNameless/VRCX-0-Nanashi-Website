[package]
name = "vrcx-0-nanashi-website-mailer"
description = "RemoteSync transactional email sender (Resend)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "remotesync-mailer"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
vrcx-0-nanashi-website-protocol = { path = "../protocol" }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
