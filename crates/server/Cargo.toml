[package]
name = "vrcx-0-nanashi-website-server"
description = "RemoteSync backend and admin CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "remotesync"
path = "src/main.rs"

[dependencies]
altcha = "1.0.0"
argon2 = "0.6.0"
axum = "0.8.9"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
vrcx-0-nanashi-website-protocol = { path = "../protocol" }
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
