[package]
name = "vrcx-0-nanashi-website-protocol"
description = "Wire format and cryptography shared by VRCX-0-Nanashi, the RemoteSync backend, the collector, and the website"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
ciborium = "0.2.2"
crc32fast = "1.5.2"
data-encoding = "2.11.1"
ed25519-dalek = { version = "3.0.0", features = ["zeroize", "rand_core"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
hpke = { version = "0.15.1", default-features = false, features = ["x25519", "chacha", "alloc", "getrandom"] }
ruzstd = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }
